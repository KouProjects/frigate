# NanoMQ (MIT) — local MQTT broker for Frigate edge nodes.
# Frigate: mqtt.host = mqtt, port 1883

mqtt {
  max_packet_size = 10MB
}

listeners.tcp {
  bind = "0.0.0.0:1883"
}

listeners.ws {
  bind = "0.0.0.0:8083/mqtt"
}

auth {
  allow_anonymous = true
  no_match = allow
}

# Cloud uplink: copy bridges.cloud.example.conf → bridges.conf, edit, then uncomment:
# include "bridges.conf"
