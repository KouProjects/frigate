# Copy to bridges.conf, replace placeholders, then uncomment in nanomq.conf:
#   include "bridges.conf"
#
# Credentials here are for NanoMQ bridge → cloud VM only (not Frigate config).
# local_topic must match Frigate mqtt.topic_prefix exactly.

bridges.mqtt.cloud {
  server = "tls+mqtt-tcp://cloud-windlab-vms-host:8883"
  proto_ver = 4
  clientid = "windedge-jakarta-edge-01-bridge"
  keepalive = 60s
  clean_start = true
  username = "cloud-windlab-vms-username"
  password = "cloud-windlab-vms-password"
  max_parallel_processes = 4
  max_send_queue_len = 32
  max_recv_queue_len = 128

  forwards = [
    {
      local_topic = "windedge-jakarta-edge-01/#"
      remote_topic = ""
      qos = 1
    }
  ]
}
