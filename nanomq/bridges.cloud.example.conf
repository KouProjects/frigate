# Copy to bridges.conf and uncomment include in nanomq.conf.
# Match topic_prefix in Frigate config (e.g. edge/site-01/frigate).

bridges.mqtt.cloud {
  server = "tls+mqtt-tcp://mqtt.example.com:8883"
  proto_ver = 4
  clientid = "edge-site-01"
  keepalive = 60s
  clean_start = true
  username = "edge-site-01"
  password = "changeme"
  max_parallel_processes = 4
  max_send_queue_len = 32
  max_recv_queue_len = 128

  forwards = [
    {
      local_topic = "edge/site-01/#"
      remote_topic = ""
      qos = 1
    }
  ]
}
